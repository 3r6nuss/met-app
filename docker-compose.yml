services:
  met-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: met-app
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DISCORD_CALLBACK_URL_OVERRIDE=https://met.3r6nuss.de/auth/discord/callback
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  default:
    name: nginx-proxy-manager_default
    external: true
