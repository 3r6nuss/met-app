services:
  met-app-test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: met-app-test
    ports:
      - "3002:3001"
    volumes:
      - ./data-test:/app/data
    environment:
      - PORT=3001
      - VITE_API_TARGET=http://localhost:3001
    env_file:
      - .env.test
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  default:
    name: nginx-proxy-manager_default
    external: true
